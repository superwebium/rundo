<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1d20"><meta name="description" content="RUNdo — mon challenge des PR de Haute-Vienne"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="./styles.css"><title>RUNdo · Haute-Vienne</title></head><body>
<header><div class="brand"><div class="mark">R<span>●</span></div><div><h1>RUNdo</h1><small>CHALLENGE PR · HAUTE-VIENNE</small></div></div><div id="auth"><span id="identity" style="font-size:12px;color:#a9c2ba;margin-right:8px">Mode découverte</span><button id="profile" class="outline" hidden disabled title="Profil privé">Mon profil</button><button id="strava-login" class="outline" title="Connexion Strava (activation en cours)" style="border-color:#fc4c02;color:#ff925c" disabled>Strava bientôt</button><button id="login" class="outline">Connexion</button><button id="logout" class="outline" hidden>Déconnexion</button></div></header>
<main><div class="sidebar"><div class="hero"><p class="eyebrow">MON EXPLORATION</p><div class="metric"><strong id="done-count">—</strong><span id="done-total">/ — parcours</span></div><div class="progress"><div id="progress-fill"></div></div><p id="done-percent">Chargement…</p></div>
<div class="stats"><div><span>Distance réalisée</span><strong id="done-km">—</strong></div><div><span>Restants</span><strong id="remaining">—</strong></div></div>
<div style="padding:0 23px 8px"><button id="import-legacy" class="primary" hidden style="width:100%;padding:10px">Importer mes anciens PR terminés</button></div><div class="search-panel"><label for="query">RECHERCHER UN PARCOURS</label><input id="query" type="search" placeholder="Nom, lieu, commune…" autocomplete="off"><div class="chips" id="filters"><button data-filter="all" class="active">Tous</button><button data-filter="todo">À faire</button><button data-filter="done">Terminés</button><button data-filter="gpxbad">GPX indisponible</button></div><div class="filters2"><label>Distance max.<select id="distance"><option value="999">Toutes</option><option value="5">5 km</option><option value="10">10 km</option><option value="15">15 km</option><option value="20">20 km</option></select></label><label class="check"><input id="water" type="checkbox"> Points d'eau</label></div></div>
<div class="listheading"><span id="results">Parcours</span><button id="sort" class="textbtn">Distance ↑</button></div><div id="routes" class="routes" aria-live="polite"></div>
</div><section class="mapwrap"><div id="map" role="application" aria-label="Carte des sentiers de Haute-Vienne"></div><div class="maptools"><select id="basemap" aria-label="Fond cartographique" title="Choisir le fond cartographique" style="width:170px;max-width:42vw;background:#fff;color:#153b2e;padding:9px 7px;border:0;border-radius:9px;box-shadow:0 4px 12px #0002;font:inherit;font-size:12px"><option value="osmfr">OSM France</option><option value="hiking">Randonnée</option><option value="topo">Topographique</option><option value="osm">OSM standard</option></select><button id="locate" title="Ma position" aria-label="Ma position">◎</button><button id="fit" title="Vue générale" aria-label="Vue générale">⌗</button></div><div class="legend"><span><i class="green"></i> Terminé</span><span><i class="orange"></i> À faire</span></div><div id="toast" role="status" aria-live="polite"></div></section></main>
<div class="sheet" id="sheet" hidden><button id="close" class="sheetclose" aria-label="Fermer">×</button><p class="eyebrow" id="detail-kicker">PARCOURS</p><h2 id="detail-name"></h2><div class="detail-stats"><div><small>DISTANCE</small><strong id="detail-distance"></strong></div><div><small>DÉNIVELÉ +</small><strong id="detail-ascent"></strong></div></div><p id="detail-status" class="gpx-status"></p><div class="actions"><button id="toggle-done" class="primary">Marquer terminé</button><a id="gpx" class="outline linkbutton" target="_blank" rel="noopener noreferrer" hidden>Télécharger GPX ↗</a></div><p class="hint" id="sync-hint"></p></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script type="module" src="./app.js"></script></body></html>
